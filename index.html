<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THIS — JDM CURATED</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;900&display=swap" rel="stylesheet">
    <style>
        :root { --red: #ff003c; --black: #050505; --gray: #111; --white: #ffffff; }
        body { background: var(--black); color: var(--white); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        
        /* Navigation */
        nav { padding: 30px; display: flex; justify-content: space-between; align-items: center; position: absolute; width: 100%; box-sizing: border-box; z-index: 10; }
        .logo { font-family: 'Syncopate', sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -1px; }

        /* Hero Section */
        .hero { height: 100vh; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .hero-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.6; z-index: -1; }
        .hero-content { text-align: center; }
        h1 { font-family: 'Syncopate', sans-serif; font-size: clamp(40px, 10vw, 120px); line-height: 0.9; margin: 0; text-transform: uppercase; }
        .tagline { color: var(--red); font-weight: 900; letter-spacing: 5px; margin-top: 20px; font-size: 14px; }

        /* Gallery Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 10px; background: var(--black); }
        .item { position: relative; height: 450px; overflow: hidden; background: var(--gray); border: 1px solid #222; }
        .item img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .item:hover img { transform: scale(1.1); filter: grayscale(100%); }
        .item-info { position: absolute; bottom: 20px; left: 20px; }

        /* CTA Section */
        .cta { padding: 100px 20px; text-align: center; border-top: 1px solid #222; }
        .btn { display: inline-block; background: var(--white); color: var(--black); padding: 20px 50px; text-decoration: none; font-weight: 900; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 30px; }
        
        footer { padding: 50px; font-size: 10px; color: #333; letter-spacing: 3px; text-align: center; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">THIS.</div>
        <div style="font-size: 10px; letter-spacing: 2px;">KL // UAE // GLOBAL</div>
    </nav>

    <section class="hero">
        <video autoplay muted loop playsinline class="hero-video">
            <source src="images/hero-bg.mp4" type="video/mp4">
        </video>
        
        <div class="hero-content">
            <h1>LEGENDS<br>NEVER<br>DIE</h1>
            <div class="tagline">CURATED JDM EXPORTS</div>
        </div>
    </section>

    <div class="grid">
        <div class="item">
            <img src="images/car1.jpg" alt="JDM car">
            <div class="item-info"><h3>01 // R34 GT-R</h3></div>
        </div>

        <div class="item">
            <img src="images/car2.jpg" alt="JDM car">
            <div class="item-info"><h3>02 // SUPRA MK4</h3></div>
        </div>

        <div class="item">
            <img src="images/car3.jpg" alt="JDM car">
            <div class="item-info"><h3>03 // RX-7 FD</h3></div>
        </div>

        <div class="item">
            <img src="images/car4.jpg" alt="JDM car">
            <div class="item-info"><h3>04 // NSX NA1</h3></div>
        </div>
    </div>

    <section class="cta">
        <h2 style="font-family: 'Syncopate';">READY TO IMPORT?</h2>
        <p style="color: #666; max-width: 500px; margin: 20px auto;">Direct sourcing from UAE & Japan. Shipping to Malaysia, Australia, and USA.</p>
        
        <a href="https://wa.me/601234567890" class="btn">INQUIRE VIA WHATSAPP</a>
    </section>

    <footer>
        © 2026 THIS JDM ARCHIVE. ALL RIGHTS RESERVED.
    </footer>

</body>
</html>
